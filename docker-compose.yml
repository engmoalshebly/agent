version: "3.8"

services:
  # ================================
  # SAIA Insurance Broker API
  # ================================
  saia-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saia_insurance_api
    ports:
      - "3300:3300"
    env_file:
      - .env
    environment:
      - API_TITLE=SAIA Insurance Broker API
      - API_VERSION=2.0.0
      - DEBUG=true
      - PORT=3300

      # Database
      - DB_HOST=saia-postgres
      - DB_PORT=5432
      - DB_NAME=saia_insurance
      - DB_USER=postgres
      - DB_PASSWORD=saia_secure_password

      # MongoDB
      - MONGO_URI=mongodb://saia-mongo:27017/
      - MONGO_DB_NAME=saia_conversations

      # LLM (use your keys)
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}

    depends_on:
      - saia-postgres
      - saia-mongo
    volumes:
      - ./app:/app/app:ro
    restart: unless-stopped
    networks:
      - saia-network

  # ================================
  # SAIA Frontend (React)
  # ================================
  saia-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=https://concord-saia.bineyes.com/agent/api/v1
    container_name: saia_frontend
    ports:
      - "5173:80"
    restart: unless-stopped
    networks:
      - saia-network

  # ================================
  # PostgreSQL Database
  # ================================
  saia-postgres:
    image: postgres:15-alpine
    container_name: saia_postgres
    environment:
      - POSTGRES_DB=saia_insurance
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=saia_secure_password
    ports:
      - "5433:5432"
    volumes:
      - saia_postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    networks:
      - saia-network

  # ================================
  # MongoDB (Conversations)
  # ================================
  saia-mongo:
    image: mongo:7
    container_name: saia_mongo
    ports:
      - "27018:27017"
    volumes:
      - saia_mongo_data:/data/db
    restart: unless-stopped
    networks:
      - saia-network

# ================================
# Volumes
# ================================
volumes:
  saia_postgres_data:
  saia_mongo_data:

    # ================================
    # Networks
    # ================================
networks:
  saia-network:
    driver: bridge
